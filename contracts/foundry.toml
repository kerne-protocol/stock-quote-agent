[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
base = "https://mainnet.base.org"
